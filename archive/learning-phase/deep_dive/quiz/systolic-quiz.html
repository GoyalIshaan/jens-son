<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Systolic Array Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: the 50 questions are a 5×10 grid of PEs on a datasheet-like rail, and the question sits beside it. */
:root {
  --bg: #e9edf1; --surface: #f8fafb; --ink: #17222e; --muted: #55626f; --line: #c9d2db;
  --accent: #1d4ed0; --accent-ink: #ffffff; --ok: #0d7a50; --ok-soft: #d6efe3; --bad: #bb3226; --bad-soft: #f8dfdb;
  --cell: #dbe2e9;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #10161d; --surface: #18202a; --ink: #e5eaf0; --muted: #9aa7b4; --line: #2e3a47;
    --accent: #86a8ff; --accent-ink: #0e1622; --ok: #52c795; --ok-soft: #173a2e; --bad: #f2806f; --bad-soft: #43221f;
    --cell: #26313d;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #10161d; --surface: #18202a; --ink: #e5eaf0; --muted: #9aa7b4; --line: #2e3a47;
  --accent: #86a8ff; --accent-ink: #0e1622; --ok: #52c795; --ok-soft: #173a2e; --bad: #f2806f; --bad-soft: #43221f;
  --cell: #26313d;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 400 17px/1.55 var(--sans); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code { font: 500 0.92em var(--mono); }
.wrap { max-width: 1080px; margin: 0 auto; padding: 24px 24px 56px; display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { position: sticky; top: 24px; display: grid; gap: 20px; }
h1 { font: 600 22px/1.2 var(--sans); margin: 0; text-wrap: balance; }
.tally { font: 500 14px/1.4 var(--mono); color: var(--muted); margin: 6px 0 0; font-variant-numeric: tabular-nums; }
.tally b { font-weight: 600; }
.tally .r { color: var(--ok); } .tally .w { color: var(--bad); }
.grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.pe { aspect-ratio: 1; min-width: 0; padding: 0; border: 0; border-radius: 3px; background: var(--cell); color: var(--muted); font: 500 10.5px/1 var(--mono); }
.pe.right { background: var(--ok); color: var(--surface); }
.pe.wrong { background: var(--bad); color: var(--surface); }
.pe.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.topics { display: grid; gap: 7px; margin: 0; padding: 0; list-style: none; font-size: 14px; }
.topics li { display: flex; justify-content: space-between; gap: 12px; }
.topics button { all: unset; cursor: pointer; color: var(--ink); }
.topics button:hover { color: var(--accent); }
.topics button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.topics span { font-family: var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 8px 14px; font-size: 15px; font-weight: 500; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 5px 10px; font-size: 13.5px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 28px 32px 30px; min-width: 0; }
.meta { display: flex; justify-content: space-between; gap: 12px; font: 500 13px/1.4 var(--mono); color: var(--muted); margin-bottom: 14px; }
.q { font-size: 20px; line-height: 1.5; font-weight: 500; margin: 0 0 22px; max-width: 66ch; }
.opts { display: grid; gap: 10px; margin-bottom: 20px; }
.opt { display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%; padding: 12px 14px; background: transparent; border: 1px solid var(--line); border-radius: 6px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { font: 600 13px/1.7 var(--mono); color: var(--muted); }
.opt.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); box-shadow: none; }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); box-shadow: none; }
.num { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.num label { font-size: 15px; color: var(--muted); }
.num input { width: 170px; max-width: 100%; padding: 10px 12px; font: 500 18px var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }
.num .unit { font: 500 15px var(--mono); color: var(--muted); }
.acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.note { margin: 14px 0 0; font-size: 15.5px; color: var(--muted); max-width: 66ch; }
.err { margin: 12px 0 0; font-size: 15px; color: var(--bad); }
.result { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); max-width: 66ch; }
.verdict { font-weight: 600; margin: 0 0 8px; }
.verdict.ok { color: var(--ok); } .verdict.no { color: var(--bad); }
.steps { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.see { margin: 12px 0 0; font-size: 14.5px; color: var(--muted); }
.big { font: 600 46px/1.1 var(--mono); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
h2 { font: 600 20px/1.3 var(--sans); margin: 0; text-wrap: balance; }
h3 { font: 600 16px/1.3 var(--sans); margin: 26px 0 10px; }
.bars { display: grid; gap: 10px; }
.bar { display: grid; grid-template-columns: 160px minmax(0, 1fr) 62px; gap: 12px; align-items: center; font-size: 14.5px; }
.track { height: 10px; background: var(--cell); border-radius: 2px; overflow: hidden; }
.fill { height: 100%; background: var(--ok); }
.bar span:last-child { font-family: var(--mono); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
.miss { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.miss button { all: unset; cursor: pointer; display: block; padding: 6px 0; font-size: 15.5px; }
.miss button:hover { color: var(--accent); }
.miss button:focus-visible { outline: 2px solid var(--accent); }
.miss b { font: 600 13.5px var(--mono); color: var(--bad); margin-right: 8px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 14px; }
@media (max-width: 820px) {
  .wrap { grid-template-columns: minmax(0, 1fr); padding: 16px 16px 40px; gap: 16px; }
  .rail { position: static; }
  .topics { display: none; }
  .card { padding: 20px 18px 22px; }
  .q { font-size: 18.5px; }
  .pe { font-size: 10px; }
  .bar { grid-template-columns: 112px minmax(0, 1fr) 54px; font-size: 13.5px; }
}
@media (prefers-reduced-motion: no-preference) { .pe, .opt, .btn { transition: background-color .12s, border-color .12s; } }
</style>
</head>
<body>
<div class="wrap">
  <aside class="rail">
    <div>
      <h1>Systolic Array Quiz</h1>
      <p class="tally" id="tally"></p>
    </div>
    <div class="grid" id="grid" aria-label="Questions"></div>
    <ul class="topics" id="topics"></ul>
    <div class="tools" id="tools"></div>
  </aside>
  <main class="card" id="card" aria-live="polite"></main>
</div>
<script>
// Question bank for the systolic array quiz.
// type 'n' = type a number. type 'c' = pick one, and opts[0] is always the right answer in this file.
// The page shuffles options with a fixed seed. verify.js recomputes every numeric answer from first principles.
const TOPICS = ['Timing', 'Dataflow', 'Cutting fill', 'Overlap and readout', 'Packing', 'Skew', 'Design calls'];

const QUESTIONS = [
// ---------- Timing ----------
{ id: 't1', topic: 'Timing', type: 'n', ans: 10, unit: '',
  q: 'An output-stationary 5×3 array runs one tile with K = 6. Operands hop one PE per beat, and beats count from 0. On which beat does PE(3,2) do its last MAC?',
  hint: 'Find the beat this PE starts on, then remember it works for K beats in a row.',
  why: ['A value needs r + c hops to reach PE(r,c), so PE(3,2) starts on beat 5.', 'It works for 6 beats: 5, 6, 7, 8, 9, 10.', 'Its last MAC is on beat 10. The trap is 11, which forgets that the first beat counts as one of the six.'],
  see: 'The timing that matters' },
{ id: 't2', topic: 'Timing', type: 'n', ans: 9, unit: 'PEs',
  q: 'Same 5×3 array, K = 6. How many of the 15 PEs are doing a MAC on beat 3?',
  hint: 'PE(r,c) is busy on beats r+c through r+c+5. Count the PEs where beat 3 falls inside that window.',
  why: ['Nobody has finished yet, because the earliest finish is beat 5. So only the start matters: r + c must be 3 or less.', 'Row 0 has 3 such PEs, row 1 has 3, row 2 has 2, row 3 has 1, and row 4 has 0.', '3 + 3 + 2 + 1 = 9.'],
  see: 'Watch a small one run' },
{ id: 't3', topic: 'Timing', type: 'n', ans: 12, unit: 'PEs',
  q: 'A 4×4 array runs one isolated tile with K = 4. What is the largest number of PEs that are busy on the same beat?',
  hint: 'Count how many PEs sit on each diagonal r+c. Then find the best 4 diagonals in a row.',
  why: ['The diagonals r+c = 0 to 6 hold 1, 2, 3, 4, 3, 2, 1 PEs.', 'A PE stays busy for K = 4 beats, so on any beat exactly 4 neighbouring diagonals are busy.', 'The best window is 2 + 3 + 4 + 3 = 12. The array never reaches 16, because the first corner stops before the last corner starts.'],
  see: 'Watch a small one run' },
{ id: 't4', topic: 'Timing', type: 'n', ans: 9, unit: '',
  q: 'On a 6×4 array, what is the smallest K for which all 24 PEs are busy on the same beat at least once?',
  hint: 'PE(0,0) must still be working when the last PE starts.',
  why: ['The last PE, PE(5,3), starts on beat 8.', 'PE(0,0) works on beats 0 to K−1, so it must still be busy on beat 8.', 'K − 1 ≥ 8, so K = 9. In general K must be at least R + C − 1.'],
  see: 'Watch a small one run' },
{ id: 't5', topic: 'Timing', type: 'c',
  q: 'A colleague says: "Fill costs R+C−2 beats and drain costs another R+C−2, so each tile wastes 2(R+C−2) beats." What is wrong with this?',
  opts: ['Each PE idles R+C−2 in total, split between the start and the end', 'Drain is free, because results stay in the accumulators until they are read', 'Fill only costs R−1, because rows and columns fill at the same time', 'Nothing is wrong, but it only applies to weight-stationary arrays'],
  hint: 'Follow one PE through the whole tile. How long is it busy, and how long is the tile?',
  why: ['The tile lasts K + R + C − 2 beats, and each PE works K of them. So every PE idles exactly R + C − 2.', 'PE(0,0) idles at the end, the far corner idles at the start, and a middle PE does some of each.', 'Fill and drain are two views of one tax, paid once.'],
  see: 'Watch a small one run' },
{ id: 't6', topic: 'Timing', type: 'n', ans: 896, unit: 'PE-beats',
  q: 'An 8×8 array runs one isolated tile with K = 10. Add up every beat that every PE spends idle during the tile. What is the total?',
  hint: 'Every PE idles the same number of beats.',
  why: ['Each PE idles R + C − 2 = 14 beats.', '64 PEs × 14 = 896.', 'Check: the tile lasts 24 beats, so 64 × 24 = 1,536 slots. Work takes 64 × 10 = 640, and 1,536 − 640 = 896.'],
  see: 'Watch a small one run' },
{ id: 't7', topic: 'Timing', type: 'n', ans: 270, unit: '',
  q: 'You want at least 90% utilization on isolated tiles on a 16×16 array. What is the smallest K that gets there?',
  hint: 'Utilization is K ÷ (K + fill). Set that to 0.9 and solve.',
  why: ['Fill is 16 + 16 − 2 = 30.', 'K ÷ (K + 30) = 0.9 gives K = 0.9K + 27, so 0.1K = 27.', 'K = 270. That is about nine times the fill, which is why the rule of thumb says the stream must be about ten times R + C.'],
  see: 'What isolated tiles cost' },
{ id: 't8', topic: 'Timing', type: 'c',
  q: 'You grow an array from 64×64 to 128×128, which is 4× the MACs. Tiles are isolated and K = 128. How much more useful work per beat do you get?',
  opts: ['About 2.7×', 'Exactly 4×', 'About 2×', 'About 1.3×'],
  hint: 'Useful MACs per beat = number of MACs × utilization. Work out both sizes.',
  why: ['64×64: fill is 126, so utilization is 128 ÷ 254 = 50.4%. That gives 4,096 × 0.504 ≈ 2,064 MACs per beat.', '128×128: fill is 254, so utilization is 128 ÷ 382 = 33.5%. That gives 16,384 × 0.335 ≈ 5,490 MACs per beat.', '5,490 ÷ 2,064 ≈ 2.7×. Fill grows with the side, so you lose part of what you paid for.'],
  see: 'What isolated tiles cost' },

// ---------- Dataflow ----------
{ id: 'd1', topic: 'Dataflow', type: 'n', ans: 255, unit: 'beats',
  q: 'A weight-stationary 128×128 array already holds its weights. One activation row arrives (M = 1). Using beats = T×M + R + C − 2 with T = 1, how long until the job is done?',
  hint: 'The stream here is M, and M is 1.',
  why: ['1 × 1 + 128 + 128 − 2 = 255 beats.', 'Each PE does one MAC in those 255 beats, so utilization is 1 ÷ 255, about 0.4%.', 'This is why decode at M = 1 is so hard: the stream is too short to hide anything.'],
  see: 'Weight-stationary timing' },
{ id: 'd2', topic: 'Dataflow', type: 'c',
  q: 'With BF16 operands and FP32 sums, an output-stationary PE moves 16 + 16 = 32 bits per beat, while a weight-stationary PE moves 16 + 32 = 48. Why might you still choose weight-stationary?',
  opts: ['Each weight loads once for many rows, and sums need no readout path', 'Its partial sums stay inside the PE, so its accumulators can be narrower', 'Its fill is shorter, because weights never have to hop into place', 'It needs no skew, because activations and sums travel together'],
  hint: 'Think about what the higher wire traffic buys you, and what output-stationary has to build instead.',
  why: ['Weight-stationary reuses a loaded weight for every row that streams past, so it suits large M.', 'Sums flow out of the bottom as part of the stream, so it needs no readout path through the array. Accumulators can sit outside.', 'It still pays fill and still needs skew. Its sums are wide and they move, which is where the 32 extra wire bits come from.'],
  see: 'The three dataflows' },
{ id: 'd3', topic: 'Dataflow', type: 'n', ans: 4, unit: 'reads',
  q: 'Compute M = 1024, N = 256, K = 256 on a 256×256 output-stationary array. Each output tile is 256×256, and each tile streams its own copy of B through the array. How many times is each weight read from memory?',
  hint: 'How many output tiles are there? Which of them need B?',
  why: ['The output is 1024×256, so it takes 1024 ÷ 256 = 4 tiles.', 'All 4 tiles need all of B, so each weight is read 4 times.', 'Weight-stationary would load B once and stream all 1,024 rows past it. That is the reuse argument in one number.'],
  see: 'The three dataflows' },
{ id: 'd4', topic: 'Dataflow', type: 'c',
  q: 'You raise decode batch from 1 to 64 users. Projections speed up a lot, but attention barely does. Why?',
  opts: ['Users share weights, but each has a private KV cache', 'Attention uses softmax, and softmax cannot run on a matrix unit', 'Attention has a smaller K, so fill stays large at any batch size', 'The KV cache is stored in lower precision than the weights'],
  hint: 'Batching makes a long stream only if many rows pass the same stationary data.',
  why: ['In a projection, all 64 users multiply by the same weights, so 64 rows stream past one weight tile.', 'In attention, the matrix being multiplied is each user\'s own K and V. Nobody shares it.', 'So a batch of 64 gives 64 separate small jobs, not one job with M = 64.'],
  see: 'Why not build it infinitely large' },
{ id: 'd5', topic: 'Dataflow', type: 'n', ans: 37.5, tol: 0.1, unit: '%',
  q: 'You run Q·Kᵀ on a 256×256 weight-stationary array, holding Kᵀ as the stationary matrix. Head dimension is 96, and the reduction runs down the rows. Ignoring fill, what percent of the array can do useful work?',
  hint: 'In weight-stationary, the reduction dimension sits in space along the rows.',
  why: ['The reduction is 96 long, so only 96 of the 256 rows have something to add up.', '96 ÷ 256 = 37.5%.', 'A longer stream does not help here. This is a shape mismatch, not a fill problem.'],
  see: 'Why not build it infinitely large' },
{ id: 'd6', topic: 'Dataflow', type: 'c',
  q: 'At batch 1 (M = 1), you switch a design between output-stationary and weight-stationary. What happens to the weight bytes read per token?',
  opts: ['Nothing, because every weight is used exactly once either way', 'They drop by the array height, because weight-stationary reuses weights', 'They double, because weight-stationary has to preload every tile first', 'They drop by half, because partial sums no longer use the same wires'],
  hint: 'With one row of activations, how many times can a given weight be used?',
  why: ['With M = 1, each weight meets exactly one activation, so it is used once.', 'A dataflow can only save reads when there is reuse to capture. There is none here.', 'Every weight must get to a multiplier once per token, whichever dataflow you pick.'],
  see: 'Your chip' },
{ id: 'd7', topic: 'Dataflow', type: 'n', ans: 64, unit: 'values',
  q: 'You have 256 MACs, built as four separate 8×8 arrays. How many operand values must enter from memory per beat? (A single 16×16 array would need 32.)',
  hint: 'An R×C array takes in R + C values per beat.',
  why: ['One 8×8 array takes in 8 + 8 = 16 values per beat.', 'Four of them take in 64.', 'The 16×16 array has the same MACs at half the edge traffic. Each value entering it gets used 16 times, not 8.'],
  see: 'Why bigger is better' },

// ---------- Cutting fill ----------
{ id: 'f1', topic: 'Cutting fill', type: 'c',
  q: 'A 12×20 array (12 rows, 20 columns) normally has fill 30. You can afford to broadcast only one operand. Which choice gives the smallest fill?',
  opts: ['Broadcast A across each 20-wide row, fill 11', 'Broadcast B down each 12-tall column, fill 11', 'Broadcast B down each 12-tall column, fill 19', 'Either one, fill 15'],
  hint: 'Whatever you broadcast stops costing hops. The other operand still hops. How far?',
  why: ['Broadcast A across rows: a PE\'s start now depends only on its row, so fill is R − 1 = 11.', 'Broadcast B down columns: start depends only on the column, so fill is C − 1 = 19.', 'Broadcast along the long side, so that the remaining hops are on the short side. The price is a longer wire: it spans 20 PEs, not 12.'],
  see: 'Shrink: broadcast instead of hop' },
{ id: 'f2', topic: 'Cutting fill', type: 'n', ans: 189, unit: '',
  q: 'A 64×64 array runs isolated tiles. Design A hops at 2 GHz (fill 126). Design B broadcasts one operand (fill 63), but its long wire drops the clock to 1.6 GHz. At what K do they take the same real time?',
  hint: 'Real time = beats × time per beat. 2 GHz is 0.5 ns and 1.6 GHz is 0.625 ns.',
  why: ['A: (K + 126) × 0.5 ns. B: (K + 63) × 0.625 ns.', 'Set them equal: 0.5K + 63 = 0.625K + 39.375.', '23.625 = 0.125K, so K = 189.', 'Below 189 broadcast wins, because fill dominates. Above it hopping wins, because the slower clock taxes every work beat.'],
  see: 'Shrink: broadcast instead of hop' },
{ id: 'f3', topic: 'Cutting fill', type: 'n', ans: 375, unit: 'PEs',
  q: 'A beat is 800 ps, and the PE\'s own logic needs 350 ps of it. Wire delay is 100 ps per mm, and each PE is 12 µm wide. How many PEs can one broadcast wire span and still fit in the beat?',
  hint: 'Find the time left for the wire, turn that into mm, then divide by the PE width.',
  why: ['Time left for the wire: 800 − 350 = 450 ps.', '450 ps ÷ 100 ps per mm = 4.5 mm.', '4.5 mm ÷ 0.012 mm = 375 PEs. This ignores the buffers needed to drive that many loads, so the real figure would be lower.'],
  see: 'Shrink: broadcast instead of hop' },
{ id: 'f4', topic: 'Cutting fill', type: 'c',
  q: 'You have a 4×32 array with hopping fill 34. Which change cuts fill the most, and by how much?',
  opts: ['Broadcast across the 32-wide rows, fill 3', 'Feed from the diagonal, fill 3', 'Feed from the diagonal, fill 17', 'Broadcast down the 4-tall columns, fill 3'],
  hint: 'Diagonal fill is max(R,C) − 1. Broadcasting along rows leaves R − 1.',
  why: ['Diagonal feed gives max(4, 32) − 1 = 31, which saves only 3 beats. The diagonal only halves fill on square arrays.', 'Broadcast across rows gives R − 1 = 3.', 'Broadcast down columns gives C − 1 = 31.', 'The wire spans only 32 PEs, about 0.4 mm at 12 µm each, so the broadcast is cheap here.'],
  see: 'Shrink: feed from the diagonal' },
{ id: 'f5', topic: 'Cutting fill', type: 'n', ans: 1.33, tol: 0.01, unit: '× faster',
  q: 'On a 256×256 array with isolated tiles and K = 512, how much faster is diagonal feed than normal edge feed?',
  hint: 'Compare total beats. Fill is 510 for edge feed and 255 for diagonal feed.',
  why: ['Edge feed: 512 + 510 = 1,022 beats.', 'Diagonal feed: 512 + 255 = 767 beats.', '1,022 ÷ 767 ≈ 1.33×. The 2× limit is only reached when K is close to zero.'],
  see: 'Shrink: feed from the diagonal' },
{ id: 'f6', topic: 'Cutting fill', type: 'n', ans: 2048, unit: 'bits',
  q: 'A 16×16 int8 array has 256 MACs. Plain PEs hold one 8-bit A and one 8-bit B register each, for 4,096 operand bits in total. Now group them into an 8×8 grid of 2×2 cells, each cell registering 2 A values and 2 B values. How many operand bits are left?',
  hint: 'Count operand registers per cell, then multiply by the number of cells.',
  why: ['A cell holds 2 A values and 2 B values, which is 4 × 8 = 32 bits.', 'There are 64 cells, so 64 × 32 = 2,048 bits.', 'The four MACs in a cell share those values, which is where the saving comes from. Accumulators do not shrink: there is still one per MAC.'],
  see: 'Packing M and N: a small outer product per beat' },
{ id: 'f7', topic: 'Cutting fill', type: 'n', ans: 16, unit: 'segments',
  q: 'A weight-stationary column is 128 long. You cut it into S segments, where S is a power of 2, and add the totals with a tree. What is the smallest S that gets drain down to 12 beats or fewer?',
  hint: 'Drain = R ÷ S + log₂S. Try S = 4, 8, 16.',
  why: ['S = 4: 32 + 2 = 34.', 'S = 8: 16 + 3 = 19.', 'S = 16: 8 + 4 = 12, which meets the target. That costs 15 extra adders per column.', 'Going to S = 128 only reaches 8 beats, for 127 adders and long wires. Most of the benefit comes early.'],
  see: 'Shrink: end the column chain early' },
{ id: 'f8', topic: 'Cutting fill', type: 'c',
  q: 'You add clock gating to every PE, so idle PEs stop toggling. What changes for a short, fill-heavy tile?',
  opts: ['Energy falls, but the tile takes exactly as many beats', 'Beats fall, because gated PEs skip the fill stage', 'Both beats and energy fall by the utilization lost', 'Nothing changes, because idle PEs burn no power anyway'],
  hint: 'Does gating move any data sooner?',
  why: ['Values still need the same hops, so timing does not change.', 'Idle PEs stop burning dynamic power, so energy falls.', 'Time and energy are separate budgets. Gating helps only the second one.'],
  see: 'Make it cheap' },
{ id: 'f9', topic: 'Cutting fill', type: 'n', ans: 1.67, tol: 0.01, unit: '× faster',
  q: 'A 256×256 output tile with K = 128 runs as one isolated tile on either a 256×256 array or four 128×128 arrays, each doing one quadrant at the same time. How much faster are the four small arrays?',
  hint: 'The two options have the same MACs. Only the fill differs.',

// Fixed-seed option order, so a question always looks the same and the right answer has no favourite slot.
const SALT = 's10';
function shuffleFor(id, n) {
  let h = 2166136261;
  for (const ch of id + SALT) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); }
  const rnd = () => { h = Math.imul(h ^ (h >>> 15), 2246822519); h = Math.imul(h ^ (h >>> 13), 3266489917); h ^= h >>> 16; return (h >>> 0) / 4294967296; };
  const idx = Array.from({ length: n }, (_, i) => i);
  for (let i = n - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
  return idx;
}

<script>
'use strict';
const KEY = 'systolic-quiz-v1';
const LETTERS = ['A', 'B', 'C', 'D'];
let state = { answers: {}, cur: 0, view: 'q' };
let draft = null, hintOpen = false, errMsg = '', confirming = false;
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.answers) state = { answers: s.answers, cur: s.cur || 0, view: 'q' }; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ answers: state.answers, cur: state.cur })); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>');
const fmt = n => Number(n).toLocaleString('en-US');
const counts = () => {
  let r = 0, w = 0;
  for (const q of QUESTIONS) { const a = state.answers[q.id]; if (a) a.ok ? r++ : w++; }
  return { r, w, left: QUESTIONS.length - r - w };
};
function parseNum(t) {
  const c = t.trim().replace(/[,\s%×x]/g, '');
  if (c === '' || !/^[-+]?(\d+\.?\d*|\.\d+)$/.test(c)) return null;
  return Number(c);
}

function renderRail() {
  const { r, w, left } = counts();
  $('tally').innerHTML = `<b class="r">${r}</b> right · <b class="w">${w}</b> wrong · ${left} left`;
  $('grid').innerHTML = QUESTIONS.map((q, i) => {
    const a = state.answers[q.id];
    const st = a ? (a.ok ? 'right' : 'wrong') : '';
    const label = `Question ${i + 1}, ${q.topic}${a ? (a.ok ? ', right' : ', wrong') : ''}`;
    return `<button class="pe ${st} ${state.view === 'q' && i === state.cur ? 'now' : ''}" data-go="${i}" aria-label="${label}" title="${label}">${i + 1}</button>`;
  }).join('');
  $('topics').innerHTML = TOPICS.map(t => {
    const qs = QUESTIONS.filter(q => q.topic === t);
    const ok = qs.filter(q => state.answers[q.id] && state.answers[q.id].ok).length;
    return `<li><button data-go="${QUESTIONS.indexOf(qs[0])}">${t}</button><span>${ok}/${qs.length}</span></li>`;
  }).join('');
  const missed = counts().w;
  $('tools').innerHTML = confirming
    ? `<div class="confirm"><span>Clear all your answers?</span><button class="btn small" id="yes">Clear answers</button><button class="btn small" id="no">Keep them</button></div>`
    : `<button class="btn small" id="results">See results</button>
       <button class="btn small" id="retry" ${missed ? '' : 'disabled'}>Retry wrong (${missed})</button>
       <button class="btn small" id="reset">Start over</button>`;
}

function renderQuestion() {
  const i = state.cur, q = QUESTIONS[i], a = state.answers[q.id], done = !!a;
  let body = '';
  if (q.type === 'c') {
    const order = shuffleFor(q.id, q.opts.length);
    body = '<div class="opts">' + order.map((o, pos) => {
      let cls = '';
      if (done) { if (o === 0) cls = 'is-right'; else if (a.given === o) cls = 'is-wrong'; }
      else if (draft === o) cls = 'sel';
      return `<button class="opt ${cls}" data-opt="${o}" ${done ? 'disabled' : ''}><span class="k">${LETTERS[pos]}</span><span>${rich(q.opts[o])}</span></button>`;
    }).join('') + '</div>';
  } else {
    const v = done ? a.given : (draft == null ? '' : draft);
    body = `<div class="num"><label for="ans">Your answer</label>
      <input id="ans" inputmode="decimal" autocomplete="off" value="${esc(v)}" ${done ? 'disabled' : ''}>
      ${q.unit ? `<span class="unit">${esc(q.unit)}</span>` : ''}</div>`;
  }
  const last = i === QUESTIONS.length - 1;
  const acts = done
    ? `<button class="btn main" id="next">${last ? 'See results' : 'Next question'}</button>${i ? '<button class="btn" id="prev">Previous</button>' : ''}`
    : `<button class="btn main" id="check">Check answer</button>
       <button class="btn" id="hint" ${hintOpen ? 'disabled' : ''}>Show hint</button>
       <button class="btn" id="skip">Skip</button>`;
  let result = '';
  if (done) {
    const shown = q.type === 'n' ? `${fmt(q.ans)}${q.unit ? ' ' + esc(q.unit) : ''}` : '';
    const head = a.ok ? 'Right.' : (q.type === 'n' ? `Not quite. The answer is ${shown}.` : 'Not quite. The right answer is marked in green.');
    result = `<section class="result"><p class="verdict ${a.ok ? 'ok' : 'no'}">${head}</p>
      <ol class="steps">${q.why.map(s => `<li>${rich(s)}</li>`).join('')}</ol>
      <p class="see">Chapter section: ${esc(q.see)}</p></section>`;
  }
  $('card').innerHTML = `<div class="meta"><span>${esc(q.topic)}</span><span>${i + 1} of ${QUESTIONS.length}</span></div>
    <p class="q">${rich(q.q)}</p>${body}<div class="acts">${acts}</div>
    ${errMsg ? `<p class="err">${esc(errMsg)}</p>` : ''}
    ${hintOpen && !done ? `<p class="note">Hint: ${rich(q.hint)}</p>` : ''}${result}`;
}

function renderResults() {
  const { r, w, left } = counts();
  const seen = r + w;
  const bars = TOPICS.map(t => {
    const qs = QUESTIONS.filter(q => q.topic === t);
    const ok = qs.filter(q => state.answers[q.id] && state.answers[q.id].ok).length;
    return `<div class="bar"><span>${t}</span><div class="track"><div class="fill" style="width:${ok / qs.length * 100}%"></div></div><span>${ok}/${qs.length}</span></div>`;
  }).join('');
  const missed = QUESTIONS.map((q, i) => ({ q, i })).filter(x => state.answers[x.q.id] && !state.answers[x.q.id].ok);
  const firstOpen = QUESTIONS.findIndex(q => !state.answers[q.id]);
  $('card').innerHTML = `<h2>Your results</h2>
    <p class="big">${r}/${QUESTIONS.length}</p>
    <p class="note" style="margin-top:0">${left ? `You have answered ${seen} so far, and ${left} are still open.` : 'You have answered every question.'}</p>
    <h3>By topic</h3><div class="bars">${bars}</div>
    ${missed.length ? `<h3>Questions to look at again</h3><ul class="miss">${missed.map(x => `<li><button data-go="${x.i}"><b>${x.i + 1}</b>${rich(x.q.q.length > 92 ? x.q.q.slice(0, 90).trim() + '…' : x.q.q)}</button></li>`).join('')}</ul>` : ''}
    ${left ? `<div class="acts" style="margin-top:22px"><button class="btn main" data-go="${firstOpen}">Go to the next open question</button></div>` : ''}`;
}

function render() {
  renderRail();
  state.view === 'q' ? renderQuestion() : renderResults();
  const inp = $('ans');
  if (inp && !inp.disabled && window.matchMedia('(min-width: 821px)').matches) inp.focus();
}
function go(i) { state.cur = i; state.view = 'q'; draft = null; hintOpen = false; errMsg = ''; save(); render(); window.scrollTo(0, 0); }
function nextIndex() {
  for (let k = 1; k <= QUESTIONS.length; k++) { const j = (state.cur + k) % QUESTIONS.length; if (!state.answers[QUESTIONS[j].id]) return j; }
  return -1;
}
function check() {
  const q = QUESTIONS[state.cur];
  if (state.answers[q.id]) return;
  if (q.type === 'c') {
    if (draft == null) { errMsg = 'Pick an option first.'; return render(); }
    state.answers[q.id] = { given: draft, ok: draft === 0 };
  } else {
    const raw = $('ans').value, v = parseNum(raw);
    if (v == null) { draft = raw; errMsg = 'Type a number, such as 42 or 1.5.'; return render(); }
    state.answers[q.id] = { given: raw.trim(), ok: Math.abs(v - q.ans) <= (q.tol || 0) + 1e-9 };
  }
  draft = null; hintOpen = false; errMsg = ''; save(); render();
}
function next() {
  const i = state.cur;
  if (i === QUESTIONS.length - 1) { state.view = 'r'; render(); window.scrollTo(0, 0); } else go(i + 1);
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.go != null) return go(+t.dataset.go);
  if (t.dataset.opt != null) { draft = +t.dataset.opt; errMsg = ''; return render(); }
  switch (t.id) {
    case 'check': return check();
    case 'hint': hintOpen = true; return render();
    case 'skip': { const j = nextIndex(); const k = j === state.cur || j < 0 ? (state.cur + 1) % QUESTIONS.length : j; return go(k); }
    case 'next': return next();
    case 'prev': return go(state.cur - 1);
    case 'results': state.view = 'r'; return render();
    case 'retry': {
      const wrong = QUESTIONS.findIndex(q => state.answers[q.id] && !state.answers[q.id].ok);
      for (const q of QUESTIONS) if (state.answers[q.id] && !state.answers[q.id].ok) delete state.answers[q.id];
      return go(wrong < 0 ? 0 : wrong);
    }
    case 'reset': confirming = true; return renderRail();
    case 'no': confirming = false; return renderRail();
    case 'yes': state.answers = {}; confirming = false; return go(0);
  }
});
document.addEventListener('input', e => { if (e.target.id === 'ans') draft = e.target.value; });
document.addEventListener('keydown', e => {
  if (state.view !== 'q' || e.metaKey || e.ctrlKey || e.altKey) return;
  const q = QUESTIONS[state.cur], done = !!state.answers[q.id];
  if (e.key === 'Enter') {
    const tag = e.target.tagName;
    if (tag === 'BUTTON' && e.target.id !== 'ans' && !e.target.classList.contains('opt')) return;
    e.preventDefault(); return done ? next() : check();
  }
  if (!done && q.type === 'c' && /^[1-4a-dA-D]$/.test(e.key)) {
    const pos = /\d/.test(e.key) ? +e.key - 1 : e.key.toUpperCase().charCodeAt(0) - 65;
    draft = shuffleFor(q.id, q.opts.length)[pos]; errMsg = ''; render();
  }
});
render();
</script>
</body>
</html>
